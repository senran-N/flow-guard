<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="cyanPurp" x1="120" y1="160" x2="520" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="purpGreen" x1="520" y1="160" x2="1080" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="460" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.65"/>
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="320" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="18.5" stroke="#1E293B" stroke-width="3"/>

  <!-- Subtle Glow Orbs -->
  <circle cx="760" cy="90" r="140" fill="#22D3EE" fill-opacity="0.05"/>
  <circle cx="980" cy="210" r="160" fill="#34D399" fill-opacity="0.05"/>

  <!-- Left Column: Brand & Tagline -->
  <g transform="translate(64, 58)">
    <!-- Mini Badge Pill -->
    <rect x="0" y="0" width="296" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="16" cy="14" r="4.5" fill="#22D3EE"/>
    <text x="30" y="18.5" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">MCP CAUSALITY ARCHITECTURE ENGINE</text>

    <!-- Main Title -->
    <text x="0" y="92" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5">FlowGuard</text>

    <!-- Subtitle -->
    <text x="2" y="132" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18.5" font-weight="500">
      End-to-End Causality Flow (<tspan fill="#22D3EE" font-weight="700">Source</tspan> ➔ <tspan fill="#818CF8" font-weight="700">Branch</tspan> ➔ <tspan fill="#34D399" font-weight="700">Sink</tspan>) Vision &amp; Verifier
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 162)">
      <rect x="0" y="0" width="144" height="32" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="72" y="20.5" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">25 Extensions</text>

      <rect x="156" y="0" width="166" height="32" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="239" y="20.5" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">6 Polyglot Bridges</text>

      <rect x="334" y="0" width="158" height="32" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="413" y="20.5" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">0 Dependencies</text>
    </g>
  </g>

  <!-- Right Column: Interactive Topology Graphic -->
  <g transform="translate(650, 36)">
    <!-- Backdrop Panel -->
    <rect x="0" y="0" width="490" height="248" rx="16" fill="#0B1120" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Layer Headers -->
    <text x="74" y="34" text-anchor="middle" fill="#22D3EE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">SOURCE</text>
    <text x="245" y="34" text-anchor="middle" fill="#818CF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">BRANCH / BRIDGE</text>
    <text x="416" y="34" text-anchor="middle" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">SINK / SSOT</text>

    <!-- Connecting Flow Curves -->
    <path d="M114 82 C165 82, 165 130, 205 130" stroke="url(#cyanPurp)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M114 178 C165 178, 165 130, 205 130" stroke="url(#cyanPurp)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M285 130 C335 130, 335 76, 376 76" stroke="url(#purpGreen)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M285 130 C335 130, 335 130, 376 130" stroke="url(#purpGreen)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M285 130 C335 130, 335 184, 376 184" stroke="url(#purpGreen)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Source Nodes -->
    <rect x="34" y="62" width="80" height="40" rx="10" fill="#0F172A" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
    <text x="74" y="86" text-anchor="middle" fill="#ECFEFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600">UI / CLI</text>

    <rect x="34" y="158" width="80" height="40" rx="10" fill="#0F172A" stroke="#22D3EE" stroke-width="2" filter="url(#glow)"/>
    <text x="74" y="182" text-anchor="middle" fill="#ECFEFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600">RPC / IPC</text>

    <!-- Central Branch Hub -->
    <rect x="205" y="102" width="80" height="56" rx="12" fill="#1E1B4B" stroke="#818CF8" stroke-width="2.2" filter="url(#glow)"/>
    <text x="245" y="127" text-anchor="middle" fill="#E0E7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">Router</text>
    <text x="245" y="144" text-anchor="middle" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Hub Node</text>

    <!-- Sink Nodes -->
    <rect x="376" y="56" width="82" height="40" rx="10" fill="#064E3B" fill-opacity="0.6" stroke="#34D399" stroke-width="2"/>
    <text x="417" y="80" text-anchor="middle" fill="#D1FAE5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">DB / Disk</text>

    <rect x="376" y="110" width="82" height="40" rx="10" fill="#064E3B" fill-opacity="0.6" stroke="#34D399" stroke-width="2"/>
    <text x="417" y="134" text-anchor="middle" fill="#D1FAE5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">Net Emit</text>

    <rect x="376" y="164" width="82" height="40" rx="10" fill="#064E3B" fill-opacity="0.6" stroke="#34D399" stroke-width="2"/>
    <text x="417" y="188" text-anchor="middle" fill="#D1FAE5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">State SSOT</text>

    <!-- Bottom Verification Status Bar -->
    <rect x="34" y="216" width="424" height="22" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="48" cy="227" r="4" fill="#34D399"/>
    <text x="60" y="231" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">
      flow_verify: <tspan fill="#34D399" font-weight="700">PASS</tspan> · 0 Dead Pipes · 0 Broken Bridges · Contracts Protected
    </text>
  </g>
</svg>
