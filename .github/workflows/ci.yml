name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Torture Suite & Self-Verification (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run Adversarial Torture & Mutation Fuzzing Suite
        run: npm test

      - name: Run Self-Bootstrapped Flow Verification
        run: npm run verify:self

      - name: Run Full-Workspace Flow Verification
        run: node src/server.mjs --cli verify . --full

      - name: Install pinned MCP clients
        if: matrix.node == 24
        run: npm ci --prefix benchmark/mcp-client --ignore-scripts --no-audit --no-fund

      - name: Exercise real MCP clients
        if: matrix.node == 24
        run: npm run test:mcp-sdk
